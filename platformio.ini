[env:esp32dev]
platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
  moononournation/GFX Library for Arduino@1.6.1
  milesburton/DallasTemperature
  paulstoffregen/OneWire

build_flags =
  -O2
